const sheet=document.querySelector('.detail-sheet'),h=document.querySelector('.grabber');let sheetPosition=397,sy=0,st=397,moved=false;function ss(v){sheetPosition=Math.max(165,Math.min(397,v));sheet.style.top=sheetPosition+'px';sheet.style.height=(708-sheetPosition)+'px'}
