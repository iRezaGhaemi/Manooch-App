function toast(msg){const t=document.querySelector('.toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),1400)}

document.querySelectorAll('.category-scroll button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.category-scroll button').forEach(x=>x.classList.remove('active'));b.classList.add('active');b.scrollIntoView({behavior:'smooth',inline:'nearest',block:'nearest'})});
const phone=document.querySelector('.phone');let c=0,ty=0;function sc(v){c=Math.max(0,Math.min(120,v));phone.style.setProperty('--collapse',c)}
phone.addEventListener('wheel',e=>{if(e.target.closest('.category-scroll'))return;if((e.deltaY>0&&c<120)||(e.deltaY<0&&c>0)){e.preventDefault();sc(c+e.deltaY*.65)}},{passive:false});
phone.addEventListener('touchstart',e=>{if(!e.target.closest('.category-scroll'))ty=e.touches[0].clientY},{passive:true});phone.addEventListener('touchmove',e=>{if(e.target.closest('.category-scroll'))return;const y=e.touches[0].clientY,d=ty-y;if((d>0&&c<120)||(d<0&&c>0)){e.preventDefault();sc(c+d);ty=y}},{passive:false});
document.querySelectorAll('.hit-add-one,.hit-add-two').forEach(b=>b.onclick=()=>toast('به سبد خرید اضافه شد'));
</script></body></html>
